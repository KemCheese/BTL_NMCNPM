<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <style>
        * { box-sizing: border-box; font-family: "Segoe UI", Arial, sans-serif; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border: 1px solid #d9dee6;
            border-radius: 6px;
            padding: 28px 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .login-title {
            margin: 0 0 6px;
            text-align: center;
            color: #1c355e;
            font-size: 22px;
            font-weight: 700;
        }
        .login-subtitle {
            margin: 0 0 22px;
            text-align: center;
            color: #5b6777;
            font-size: 13px;
        }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #2f3a4a;
            font-size: 13px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid #c6cdd8;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #1c355e;
        }
        .msg-error {
            margin: 8px 0 14px;
            color: #b91c1c;
            font-size: 13px;
            min-height: 18px;
        }
        .msg-info {
            margin: 0 0 12px;
            padding: 8px 10px;
            background: #eef6ff;
            border: 1px solid #bfdbfe;
            border-radius: 4px;
            color: #1e40af;
            font-size: 13px;
        }
        .btn-submit {
            width: 100%;
            padding: 10px 14px;
            border: none;
            border-radius: 4px;
            background: #1c355e;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-submit:hover { background: #152847; }
    </style>
</head>
<body>
<div class="login-card">
    <h1 class="login-title">Chào mừng trở lại</h1>
    <p class="login-subtitle">Hệ thống mượn phòng trực tuyến PTIT</p>

    <div th:if="${infoMessage}" class="msg-info" th:text="${infoMessage}"></div>

    <form th:action="@{/login}" method="post" novalidate>
        <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <input type="text" id="username" name="username" placeholder="Nhập tên đăng nhập" autofocus>
        </div>

        <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" placeholder="Nhập mật khẩu">
        </div>

        <div class="msg-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <button type="submit" class="btn-submit">Đăng nhập</button>
    </form>
</div>
</body>
</html>
