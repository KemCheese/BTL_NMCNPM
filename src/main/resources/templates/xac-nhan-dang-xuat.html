<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận đăng xuất</title>
    <style>
        * { box-sizing: border-box; font-family: "Segoe UI", Arial, sans-serif; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .confirm-card {
            width: 100%;
            max-width: 390px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 24px 26px;
            text-align: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }
        .confirm-card h1 {
            margin: 0 0 10px;
            font-size: 19px;
            color: #1f2937;
        }
        .confirm-card p {
            margin: 0 0 6px;
            font-size: 13px;
            color: #4b5563;
        }
        .actions {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .btn-stay {
            padding: 8px 16px;
            border: 1px solid #94a3b8;
            border-radius: 4px;
            background: #f8fafc;
            color: #1c355e;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }
        .btn-logout {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: #1c355e;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="confirm-card">
    <h1>Xác nhận đăng xuất</h1>
    <p>Bạn muốn đăng xuất khỏi tài khoản?</p>
    <div class="actions">
        <a class="btn-stay" th:href="@{/trang-chu}">Ở lại</a>
        <form th:action="@{/logout}" method="post" style="margin: 0;">
            <button type="submit" class="btn-logout">Đăng xuất</button>
        </form>
    </div>
</div>
</body>
</html>
